<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>図形回転イメージゲーム - お絵描き対応版</title>
<style>
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background-color: #f4f7f6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    color: #333;
    margin: 0;
    box-sizing: border-box;
  }
  h1 { 
    font-size: 32px; 
    color: #4a4a4a; 
    margin-bottom: 15px;
  }
  .controls { margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
  select {
    padding: 12px 20px;
    font-size: 18px;
    border-radius: 10px;
    border: 2px solid #ccc;
    cursor: pointer;
    background-color: white;
  }

  /* お絵描きパネルのモーダル・エリア */
  .draw-panel {
    display: none;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    margin-bottom: 20px;
    text-align: center;
    position: absolute;
    z-index: 10;
    top: 80px;
  }
  .draw-panel.active {
    display: block;
  }
  .draw-panel h3 {
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 20px;
    color: #444;
  }
  canvas {
    border: 3px dashed #bbb;
    background: #fff;
    cursor: crosshair;
    border-radius: 12px;
    display: block;
    margin: 0 auto 15px auto;
  }
  .draw-tools {
    display: flex;
    justify-content: center;
    gap: 15px;
  }

  /* 全体のレイアウト */
  .app-layout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    width: 100%;
    max-width: 1500px;
  }

  /* ゲームエリア（ボタンと立方体） */
  .play-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    background: #fff;
    padding: 40px 30px;
    border-radius: 24px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.06);
    position: relative;
  }

  /* スペースコンテナ */
  .scene-container {
    width: 1000px; 
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-bottom: 5px solid #e0e0e0;
    overflow: hidden;
    background: #fafbfc;
    border-radius: 16px;
  }

  /* 3D空間のセットアップ */
  .scene {
    width: 160px;
    height: 160px;
    perspective: 900px;
  }
  .tilt {
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.6s ease;
    transform: rotateX(0deg) rotateY(0deg);
  }
  .cube {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .face {
    position: absolute;
    width: 160px;
    height: 160px;
    background: rgba(255, 255, 255, 0.95);
    border: 2px solid #ccc;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
  }
  
  .front {
    border: 4px solid #78909c;
    transform: rotateY(0deg) translateZ(80px);
    background: #fff;
  }
  .right  { transform: rotateY(90deg) translateZ(80px); }
  .back   { transform: rotateY(180deg) translateZ(80px); }
  .left   { transform: rotateY(-90deg) translateZ(80px); }
  .top    { transform: rotateX(90deg) translateZ(80px); background: #f0f0f0; }
  .bottom { transform: rotateX(-90deg) translateZ(80px); background: #e0e0e0; }

  /* 視点変更ボタンエリア（右側） */
  .view-controls {
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding-left: 35px;
    border-left: 2px dashed #ccc;
  }
  .view-title {
    font-size: 15px;
    font-weight: bold;
    color: #666;
    text-align: center;
    margin-bottom: -5px;
  }

  /* ボタンのスタイリング */
  button {
    font-size: 20px;
    font-weight: bold;
    padding: 20px 30px;
    color: white;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 5px 0px rgba(0,0,0,0.2);
    transition: all 0.1s;
    white-space: nowrap;
  }
  button:active { 
    transform: translateY(5px); 
    box-shadow: 0 0px 0px rgba(0,0,0,0.2); 
  }
  .button-left { background-color: #2196F3; box-shadow: 0 5px 0px #1565C0; }
  .button-right { background-color: #4CAF50; box-shadow: 0 5px 0px #2E7D32; }

  .btn-view {
    font-size: 16px;
    padding: 14px 22px;
    background-color: #90A4AE;
    box-shadow: 0 4px 0px #607D8B;
    color: white;
  }
  .btn-view.active {
    background-color: #FF9800;
    box-shadow: 0 4px 0px #F57C00;
  }

  .reset-info {
    margin-top: 15px;
    font-size: 13px;
    color: #777;
    text-align: center;
    max-width: 140px;
    line-height: 1.4;
  }
</style>
</head>
<body>

  <h1>🎲 図形の回転イメージゲーム</h1>
  
  <div class="controls">
    <label for="shapeSelect"><b>前面の模様：</b></label>
    <select id="shapeSelect">
      <option value="bear" selected>クマの顔</option>
      <option value="triangle">さんかく</option>
      <option value="arrow">上向き矢印</option>
      <option value="f">アルファベット「F」</option>
      <option value="draw">お絵描き 🎨</option>
    </select>
  </div>

  <!-- お絵描き用パネル（ポップアップ） -->
  <div class="draw-panel" id="drawPanel">
    <h3>お絵描きキャンバス</h3>
    <!-- 【変更】キャンバスのサイズを大きくしました (300×300) -->
    <canvas id="drawCanvas" width="300" height="300"></canvas>
    <div class="draw-tools">
      <button onclick="clearCanvas()" style="background-color: #E53935; box-shadow: 0 4px 0px #B71C1C; font-size:16px; padding:10px 20px;">けす</button>
      <button onclick="applyDrawing()" style="background-color: #43A047; box-shadow: 0 4px 0px #1B5E20; font-size:16px; padding:10px 20px;">これで決まり！</button>
    </div>
  </div>

  <div class="app-layout">
    <div class="play-area">
      <button class="button-left" onclick="rollLeft()">◀ 左にころがる</button>
      
      <div class="scene-container">
        <div class="scene">
          <div class="tilt" id="tilt">
            <div class="cube" id="cube">
              <div class="face front" id="frontFace"></div>
              <div class="face back"></div>
              <div class="face right"></div>
              <div class="face left"></div>
              <div class="face top"></div>
              <div class="face bottom"></div>
            </div>
          </div>
        </div>
      </div>

      <button class="button-right" onclick="rollRight()">右にころがる ▶</button>
    </div>

    <div class="view-controls">
      <div class="view-title">視点きりかえ</div>
      <button id="btnFront" class="btn-view active" onclick="setView('front')">真正面</button>
      <button id="btnDiagonal" class="btn-view" onclick="setView('diagonal')">ななめ (立体)</button>
      <div class="reset-info">※端まで行くと自動で中央に戻ります</div>
    </div>
  </div>

  <script>
    let currentAngle = 0;
    let currentX = 0; 
    const cubeSize = 160; 
    const maxLimit = 400; 

    const cube = document.getElementById('cube');
    const tilt = document.getElementById('tilt');
    const frontFace = document.getElementById('frontFace');
    const shapeSelect = document.getElementById('shapeSelect');
    const btnFront = document.getElementById('btnFront');
    const btnDiagonal = document.getElementById('btnDiagonal');
    const drawPanel = document.getElementById('drawPanel');
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');

    // お絵描き用の設定（太めのペンに変更）
    let isDrawing = false;
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#333';

    // 画面上の座標とキャンバス内の解像度を合わせるための計算
    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const pos = getMousePos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    });
    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const pos = getMousePos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    });
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mouseleave', () => isDrawing = false);

    // タッチ操作のサポート（スマホやタブレット用）
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isDrawing = true;
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const pos = {
        x: (touch.clientX - rect.left) * (canvas.width / rect.width),
        y: (touch.clientY - rect.top) * (canvas.height / rect.height)
      };
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!isDrawing) return;
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const pos = {
        x: (touch.clientX - rect.left) * (canvas.width / rect.width),
        y: (touch.clientY - rect.top) * (canvas.height / rect.height)
      };
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    });
    canvas.addEventListener('touchend', () => isDrawing = false);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function applyDrawing() {
      const dataURL = canvas.toDataURL();
      frontFace.innerHTML = '';
      frontFace.style.backgroundImage = `url(${dataURL})`;
      frontFace.style.backgroundSize = 'cover';
      drawPanel.classList.remove('active');
    }

    const shapes = {
      bear: `<svg width="120" height="120" viewBox="0 0 100 100">
               <circle cx="25" cy="25" r="15" fill="#8D6E63"/>
               <circle cx="75" cy="25" r="15" fill="#8D6E63"/>
               <circle cx="50" cy="55" r="40" fill="#A1887F"/>
               <circle cx="35" cy="45" r="5" fill="#3E2723"/>
               <circle cx="65" cy="45" r="5" fill="#3E2723"/>
               <ellipse cx="50" cy="65" rx="18" ry="14" fill="#D7CCC8"/>
               <circle cx="50" cy="60" r="5" fill="#3E2723"/>
               <path d="M 50 65 Q 50 75 42 72 M 50 65 Q 50 75 58 72" fill="none" stroke="#3E2723" stroke-width="2"/>
             </svg>`,
      triangle: `<svg width="120" height="120" viewBox="0 0 100 100">
                  <polygon points="50,15 15,85 85,85" fill="#FF7043" stroke="#D84315" stroke-width="4" stroke-linejoin="round"/>
                 </svg>`,
      arrow: `<svg width="120" height="120" viewBox="0 0 100 100">
                <polygon points="50,15 85,50 65,50 65,85 35,85 35,50 15,50" fill="#42A5F5" stroke="#1E88E5" stroke-width="4" stroke-linejoin="round"/>
              </svg>`,
      f: `<svg width="120" height="120" viewBox="0 0 100 100">
            <rect x="25" y="15" width="20" height="70" fill="#9C27B0" rx="2"/>
            <rect x="45" y="15" width="35" height="20" fill="#9C27B0" rx="2"/>
            <rect x="45" y="45" width="25" height="20" fill="#9C27B0" rx="2"/>
          </svg>`
    };

    function updateShape() {
      const val = shapeSelect.value;
      if (val === 'draw') {
        drawPanel.classList.add('active');
      } else {
        drawPanel.classList.remove('active');
        frontFace.style.backgroundImage = 'none';
        frontFace.innerHTML = shapes[val];
      }
    }

    function applyTransform() {
      cube.style.transform = `translateX(${currentX}px) rotateZ(${currentAngle}deg)`;
    }

    function rollRight() {
      currentAngle += 90;
      currentX += cubeSize;
      if (currentX > maxLimit) {
        setTimeout(() => {
          cube.style.transition = 'none';
          currentX = 0;
          applyTransform();
          setTimeout(() => {
            cube.style.transition = 'transform 1.2s cubic-bezier(0.4, 0, 0.2, 1)';
          }, 50);
        }, 1200);
      }
      applyTransform();
    }

    function rollLeft() {
      currentAngle -= 90;
      currentX -= cubeSize;
      if (currentX < -maxLimit) {
        setTimeout(() => {
          cube.style.transition = 'none';
          currentX = 0;
          applyTransform();
          setTimeout(() => {
            cube.style.transition = 'transform 1.2s cubic-bezier(0.4, 0, 0.2, 1)';
          }, 50);
        }, 1200);
      }
      applyTransform();
    }

    function setView(viewType) {
      if (viewType === 'front') {
        tilt.style.transform = 'rotateX(0deg) rotateY(0deg)';
        btnFront.classList.add('active');
        btnDiagonal.classList.remove('active');
      } else if (viewType === 'diagonal') {
        tilt.style.transform = 'rotateX(-15deg) rotateY(-25deg)';
        btnDiagonal.classList.add('active');
        btnFront.classList.remove('active');
      }
    }

    shapeSelect.addEventListener('change', updateShape);
    updateShape();
  </script>
</body>
</html>
